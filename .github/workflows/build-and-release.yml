name: Construir y publicar el PDF

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Compilar el documento
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Compilar LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: el-habla-pasiega.tex

      - name: Guardar el PDF de la compilación
        uses: actions/upload-artifact@v7
        with:
          name: el-habla-pasiega
          path: el-habla-pasiega.pdf
          if-no-files-found: error

  release:
    name: Publicar una nueva edición
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Recuperar el PDF compilado
        uses: actions/download-artifact@v8
        with:
          name: el-habla-pasiega

      - name: Calcular el número de edición
        id: edition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_EDITION="$(
            gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 1000 \
              --json tagName \
              --jq '.[].tagName | select(test("^edicion-[0-9]+$")) | sub("^edicion-"; "") | tonumber' \
            | sort -n \
            | tail -1
          )"
          LAST_EDITION="${LAST_EDITION:-0}"
          NEXT_EDITION="$((LAST_EDITION + 1))"
          echo "number=$NEXT_EDITION" >> "$GITHUB_OUTPUT"

      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: edicion-${{ steps.edition.outputs.number }}
          RELEASE_TITLE: Edición automática ${{ steps.edition.outputs.number }}
        run: >-
          gh release create "$RELEASE_TAG"
          el-habla-pasiega.pdf
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "$RELEASE_TITLE"
          --generate-notes
